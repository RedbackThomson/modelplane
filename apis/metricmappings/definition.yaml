apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: metricmappings.modelplane.ai
spec:
  group: modelplane.ai
  names:
    categories: [crossplane, modelplane, platform]
    kind: MetricMapping
    plural: metricmappings
    shortNames: [mm]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: CLUSTERS
      type: integer
      jsonPath: .status.clusters
    - name: AGE
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [metrics]
            description: >-
              How one component's metrics become part of the modelplane_*
              surface. Modelplane renders every MetricMapping into each
              inference cluster's collector, so a mapping is written once on
              the control plane and reaches the whole fleet.

              A mapping naming a component Modelplane already provides
              renames for is additive: its renames run after the built-in
              ones, and a later rename of the same metric wins.
            properties:
              metrics:
                type: array
                minItems: 1
                maxItems: 128
                description: >-
                  The metrics this component emits, and what Modelplane calls
                  them.

                  Rename only where the measurements agree. Two engines'
                  histograms sharing a name are worth less than nothing if
                  their buckets disagree, because a quantile across them is
                  wrong rather than approximate.
                items:
                  type: object
                  required: [from, to]
                  properties:
                    from:
                      type: string
                      maxLength: 255
                      description: >-
                        The metric's name as the component emits it, matched
                        exactly. Nothing here declares which engine a
                        deployment runs: a name that no component emits simply
                        matches nothing.
                    to:
                      type: string
                      maxLength: 255
                      pattern: '^modelplane_[a-z0-9_]*[a-z0-9]$'
                      description: >-
                        What Modelplane calls it. Only modelplane_* leaves a
                        cluster, so a metric with no name here is one nobody
                        downstream can read.
                    fromUnit:
                      type: string
                      enum: [Millijoules, Mebibytes, Milliseconds, Nanoseconds]
                      description: >-
                        What the component measures this in, when that isn't
                        the unit the name claims. Modelplane converts to the
                        base unit: millijoules and milliseconds are divided by
                        a thousand, nanoseconds by a billion, and mebibytes
                        multiplied out to bytes.

                        Say it whenever the source disagrees with the target,
                        even where the factor looks obvious. A name ending in
                        _bytes that holds mebibytes is the kind of thing
                        nobody notices until a capacity review, and stating
                        the source unit is what makes the conversion happen at
                        all.
          status:
            type: object
            properties:
              clusters:
                type: integer
                description: >-
                  How many inference clusters have taken these statements.
              conditions:
                type: array
                items:
                  type: object
